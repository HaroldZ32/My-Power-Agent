[package]
name = "agent-channel"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "signal", "time"] }
