name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag provenance and versions
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main
          cargo_version="$(cargo metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "agent-channel").version')"
          plugin_version="$(jq -er .version plugins/codex/.codex-plugin/plugin.json)"
          [[ "$TAG" == "v$cargo_version" && "$TAG" == "v$plugin_version" ]]

  package:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release build
        run: cargo +stable test --locked --release
      - name: Build and package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo +stable build --locked --release
          mkdir -p dist/package
          cp target/release/agent-channel LICENSE README.md README.zh-CN.md dist/package/
          cp -R plugins docs .claude-plugin dist/package/
          cp AGENT.md AGENTS.md dist/package/
          asset="agent-channel-$TAG-$(uname -s)-$(uname -m).tar.gz"
          tar -C dist/package -czf "dist/$asset" .
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-channel-${{ matrix.os }}
          path: dist/*.tar.gz*

  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-channel-*
          path: dist
          merge-multiple: true
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json >/dev/null
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft --generate-notes
          fi
