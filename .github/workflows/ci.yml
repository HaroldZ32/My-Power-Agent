name: CI

on:
  push:
    branches: ['main', 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: ['main', 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Lint
        run: cargo +stable clippy --locked --release --all-targets -- -D warnings
      - name: Test channel and MCP
        run: cargo +stable test --locked --release
